<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Leitor MR Celulares</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0f19; color: #fff; font-family: system-ui, sans-serif; }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-5 text-center">
    <div class="space-y-1">
      <h2 class="font-bold text-xl text-sky-400">Leitor de Código de Barras</h2>
      <p class="text-xs text-slate-400">Aponte a câmara para o código do produto</p>
    </div>

    <!-- Input nativo de captura de câmara otimizado para telemóveis -->
    <div class="p-6 bg-slate-950 border border-slate-800 rounded-xl space-y-3">
      <div class="w-16 h-16 mx-auto rounded-full bg-sky-950 border border-sky-800 flex items-center justify-center text-sky-400 text-2xl">
        📷
      </div>
      <p class="text-xs text-slate-300">Toque no botão abaixo para abrir a câmara traseira instantaneamente:</p>
      
      <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" onchange="tratarFotoCapturada(this)">
      
      <button onclick="document.getElementById('cameraInput').click()" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-3.5 rounded-xl text-sm shadow-lg shadow-sky-600/30 transition">
        Abrir Câmara Agora
      </button>
    </div>

    <button onclick="voltarAoApp()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-3 rounded-xl text-sm border border-slate-700 transition">
      Voltar para o Aplicativo
    </button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const redirectUrl = urlParams.get('redirect');

    function tratarFotoCapturada(input) {
      if (input.files && input.files[0]) {
        // Como tirou a foto do código de barras, redirecionamos de volta com um aviso para digitação rápida 
        // ou você pode usar o código digitado. Vamos retornar um parâmetro de sucesso.
        retornarAoApp('FOTO_CAPTURADA');
      }
    }

    function retornarAoApp(codigo) {
      if (redirectUrl) {
        window.location.href = redirectUrl + (redirectUrl.includes('?') ? '&' : '?') + 'code=' + encodeURIComponent(codigo);
      } else {
        alert('Foto capturada com sucesso!');
      }
    }

    function voltarAoApp() {
      if (redirectUrl) {
        window.location.href = redirectUrl;
      }
    }
  </script>
</body>
</html>
