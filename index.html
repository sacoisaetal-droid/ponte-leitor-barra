<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>Leitor de código de barras — MR Celulares</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;padding:18px;min-height:100vh;background:#0b1220;color:#f8fafc;font-family:Arial,sans-serif;text-align:center}
    main{max-width:560px;margin:0 auto}
    h1{font-size:22px;margin:6px 0 8px}
    p{color:#cbd5e1;font-size:14px}
    .card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:16px;margin-top:14px}
    button,input{width:100%;border-radius:11px;padding:14px;font-size:16px}
    button{border:0;background:#0284c7;color:#fff;font-weight:700;margin-top:10px;cursor:pointer}
    input{border:1px solid #475569;background:#0b1220;color:#fff;margin-top:8px}
    #reader{width:100%;border-radius:12px;overflow:hidden;background:#000;margin-top:12px;position:relative;min-height:250px}
    #reader video{width:100% !important;height:auto !important;object-fit:cover;display:block}
    #status{font-size:14px;margin-top:12px;white-space:pre-wrap;color:#38bdf8}
    .dica{font-size:12px;color:#94a3b8;margin-top:8px}
  </style>
</head>
<body>
<main>
  <h1>Leitor de Código de Barras</h1>
  <p>Aponte a câmera para o código do produto.</p>
  <section class="card">
    <div id="reader"></div>
    <p id="status">Iniciando câmera automaticamente...</p>
    <p class="dica">Aproxime bem do código, mantenha parado e com boa luz.</p>
    <button id="btnIniciar" type="button" style="display:none;" onclick="iniciarLeitor()">Iniciar Leitor</button>
    <button id="btnTrocar" type="button" style="display:none;background:#475569;" onclick="trocarCamera()">🔄 Trocar Câmera</button>
    <button id="btnTorch" type="button" style="display:none;background:#334155;" onclick="toggleTorch()">🔦 Lanterna</button>
    <button type="button" style="background:#334155;margin-top:10px;" onclick="voltarApp()">Voltar para o Aplicativo</button>
  </section>
  <section class="card">
    <label style="font-size:13px;color:#94a3b8;">Ou digite o código manualmente:</label>
    <input id="manualCode" type="text" inputmode="numeric" placeholder="Digite o código de barras">
    <button type="button" onclick="enviarManual()">Enviar Código</button>
  </section>
</main>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  let html5QrCode = null;
  let torchOn = false;
  let lido = false;
  let usandoTraseira = true;
  function getRedirectUrl(){ return new URLSearchParams(window.location.search).get("redirect") || ""; }
  function atualizarStatus(msg){ document.getElementById("status").textContent = msg; }
  function voltarApp(){ pararLeitor(); const r=getRedirectUrl(); if(r) window.location.href=r; else window.history.back(); }
  function enviarCodigo(codigo){
    if(!codigo || lido) return;
    lido = true;
    pararLeitor();
    atualizarStatus("Código lido: "+codigo+"\nRetornando ao app...");
    if(navigator.vibrate) navigator.vibrate(200);
    try{ const ctx = new (window.AudioContext || window.webkitAudioContext)(); const o=ctx.createOscillator(); o.frequency.value=900; o.connect(ctx.destination); o.start(); setTimeout(()=>o.stop(),200);}catch(e){}
    const redirect = getRedirectUrl();
    if(redirect){
      try{
        const destino = new URL(redirect);
        destino.searchParams.set("code", codigo);
        window.location.href = destino.toString();
      }catch(e){ atualizarStatus("Erro ao voltar: "+e.message); }
    } else {
      document.getElementById("manualCode").value = codigo;
    }
  }
  async function iniciarLeitor(){
    lido = false;
    atualizarStatus(usandoTraseira ? "Iniciando câmera TRASEIRA..." : "Iniciando câmera FRONTAL...");
    document.getElementById("btnIniciar").style.display = "none";
    try{
      if(html5QrCode){ try{ await html5QrCode.stop(); html5QrCode.clear(); }catch(e){} }
      html5QrCode = new Html5Qrcode("reader");
      const formatos = [
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.CODE_93,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.ITF,
        Html5QrcodeSupportedFormats.CODABAR,
        Html5QrcodeSupportedFormats.QR_CODE
      ];
      const configCamera = usandoTraseira ? { facingMode: { ideal: "environment" } } : { facingMode: { ideal: "user" } };
      await html5QrCode.start(
        configCamera,
        {
          fps: 20,
          qrbox: function(viewfinderWidth, viewfinderHeight){
            let width = Math.floor(viewfinderWidth * 0.85);
            let height = Math.floor(viewfinderHeight * 0.35);
            if(width > 500) width = 500;
            if(height > 150) height = 150;
            return { width: width, height: height };
          },
          aspectRatio: 1.7777778,
          formatsToSupport: formatos,
          experimentalFeatures: { useBarCodeDetectorIfSupported: true },
          videoConstraints: {
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            facingMode: usandoTraseira ? "environment" : "user",
            focusMode: { ideal: "continuous" }
          }
        },
        (decodedText, decodedResult) => {
          console.log("Código detectado:", decodedText);
          enviarCodigo(decodedText);
        },
        (errorMessage) => {}
      );
      atualizarStatus("Câmera ativa! Aproxime do código de barras.");
      document.getElementById("btnTrocar").style.display = "block";
      try{
        const cap = await html5QrCode.getRunningTrackCapabilities();
        if(cap && cap.torch) document.getElementById("btnTorch").style.display = "block";
        if(cap && cap.focusMode){
          try{ await html5QrCode.applyVideoConstraints({ advanced: [{ focusMode: "continuous" }] }); }catch(e){}
        }
      }catch(e){}
    } catch(err){
      console.error(err);
      atualizarStatus("Erro ao iniciar câmera: " + err.message + "\nToque em Tentar Novamente");
      document.getElementById("btnIniciar").style.display = "block";
      document.getElementById("btnIniciar").textContent = "Tentar Novamente";
    }
  }
  async function trocarCamera(){
    await pararLeitor();
    usandoTraseira = !usandoTraseira;
    iniciarLeitor();
  }
  async function toggleTorch(){
    if(!html5QrCode) return;
    torchOn = !torchOn;
    try{
      await html5QrCode.applyVideoConstraints({ advanced: [{ torch: torchOn }] });
      document.getElementById("btnTorch").textContent = torchOn ? "🔦 Lanterna OFF" : "🔦 Lanterna";
    } catch(e){ atualizarStatus("Lanterna não suportada"); }
  }
  async function pararLeitor(){
    if(html5QrCode){
      try{ await html5QrCode.stop(); html5QrCode.clear(); }catch(e){}
      html5QrCode = null;
    }
  }
  function enviarManual(){
    const v = document.getElementById("manualCode").value.trim();
    if(!v){ atualizarStatus("Digite um código antes de enviar."); return; }
    enviarCodigo(v);
  }
  document.getElementById("manualCode").addEventListener("keydown", e => { if(e.key==="Enter") enviarManual(); });
  window.addEventListener("pagehide", pararLeitor);
  
  // AUTO-INICIA O LEITOR ASSIM QUE ABRE A PÁGINA
  window.addEventListener('DOMContentLoaded', function(){
    setTimeout(function(){ iniciarLeitor(); }, 500);
  });
</script>
</body>
</html>
