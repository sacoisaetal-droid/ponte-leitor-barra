<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>Leitor de código de barras — MR Celulares</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 18px; min-height: 100vh;
      background: #0b1220; color: #f8fafc;
      font-family: Arial, sans-serif; text-align: center;
    }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 6px 0 8px; }
    p { color: #cbd5e1; font-size: 14px; line-height: 1.45; }
    .card {
      background: #111c2e; border: 1px solid #26364e;
      border-radius: 16px; padding: 16px; margin-top: 14px;
    }
    button, input {
      width: 100%; border-radius: 11px; padding: 14px; font-size: 16px;
    }
    button {
      border: 0; background: #0284c7; color: white;
      font-weight: 700; margin-top: 10px; cursor: pointer;
    }
    input {
      border: 1px solid #475569; background: #0b1220; color: white; margin-top: 8px;
    }
    #status {
      font-size: 14px; margin-top: 12px; white-space: pre-wrap; color: #38bdf8;
    }
    .btn-camera {
      background: #059669; font-size: 18px; padding: 18px; margin-top: 10px;
    }
  </style>
</head>
<body>
<main>
  <h1>Leitor de Código de Barras</h1>
  <p>Toque no botão abaixo para abrir a câmera do celular e escanear o código.</p>

  <section class="card">
    <!-- Input nativo invisível acionado pelo botão da câmera -->
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;" onchange="processarFotoCamera(this)">
    
    <button type="button" class="btn-camera" onclick="document.getElementById('cameraInput').click()">
      📷 Abrir Câmera para Escanear
    </button>

    <p id="status">Pronto para escanear.</p>

    <button type="button" style="background: #334155; margin-top: 15px;" onclick="voltarApp()">
      Voltar para o Aplicativo
    </button>
  </section>

  <section class="card">
    <label for="manualCode" style="font-size:13px;color:#94a3b8;">Ou digite o código manualmente:</label>
    <input id="manualCode" type="text" inputmode="numeric" autocomplete="off" placeholder="Digite o código de barras">
    <button type="button" onclick="enviarManual()">Enviar Código</button>
  </section>
</main>

<!-- Biblioteca ZXing para leitura de códigos em imagens capturadas -->
<script src="https://unpkg.com/@zxing/library@latest"></script>
<script>
  function getRedirectUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get("redirect") || "";
  }

  function atualizarStatus(msg) {
    document.getElementById("status").textContent = msg;
  }

  function voltarApp() {
    const redirect = getRedirectUrl();
    if (redirect) {
      window.location.href = redirect;
    } else {
      window.history.back();
    }
  }

  function enviarCodigo(code) {
    const codigo = String(code || "").trim();
    if (!codigo) return;

    atualizarStatus("Código lido: " + codigo + "\nRetornando...");
    const redirect = getRedirectUrl();

    if (redirect) {
      try {
        const destino = new URL(redirect);
        destino.searchParams.set("code", codigo);
        window.location.href = destino.toString();
      } catch (e) {
        atualizarStatus("Erro ao retornar ao app.");
      }
    } else {
      document.getElementById("manualCode").value = codigo;
    }
  }

  function processarFotoCamera(input) {
    if (!input.files || !input.files[0]) return;
    const arquivo = input.files[0];
    const reader = new FileReader();

    atualizarStatus("Lendo código da imagem...");

    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        const codeReader = new ZXing.BrowserBarcodeReader();
        codeReader.decodeFromImage(img).then(result => {
          if (result && result.text) {
            enviarCodigo(result.text);
          } else {
            atualizarStatus("Nenhum código detectado. Tente novamente mais próximo.");
          }
          input.value = "";
        }).catch(err => {
          atualizarStatus("Não foi possível decodificar. Centralize bem o código na foto.");
          input.value = "";
        });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(arquivo);
  }

  function enviarManual() {
    const valor = document.getElementById("manualCode").value.trim();
    if (!valor) {
      atualizarStatus("Digite um código antes de enviar.");
      return;
    }
    enviarCodigo(valor);
  }

  document.getElementById("manualCode").addEventListener("keydown", function(e) {
    if (e.key === "Enter") enviarManual();
  });
</script>
</body>
</html>
