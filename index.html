
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>Leitor de Código de Barras - MR Celulares</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      min-height: 100vh;
      background: #0b1220;
      color: #f8fafc;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main { max-width: 560px; margin: auto; }

    .card {
      background: #111c2e;
      border: 1px solid #26364e;
      border-radius: 16px;
      padding: 16px;
      margin-top: 14px;
    }

    h1 { font-size: 22px; }

    p {
      color: #cbd5e1;
      font-size: 14px;
      line-height: 1.45;
    }

    #interactive {
      position: relative;
      width: 100%;
      min-height: 240px;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
      margin-top: 12px;
    }

    #interactive video,
    #interactive canvas {
      display: block;
      width: 100%;
      height: auto;
      max-height: 58vh;
      object-fit: cover;
    }

    button, input {
      width: 100%;
      border-radius: 11px;
      padding: 14px;
      font-size: 16px;
      margin-top: 10px;
    }

    button {
      border: 0;
      background: #0284c7;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .55; }

    input {
      border: 1px solid #475569;
      background: #0b1220;
      color: white;
    }

    #status {
      font-size: 14px;
      margin-top: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: #38bdf8;
    }
  </style>
</head>

<body>
<main>
  <h1>📷 Leitor de Código de Barras</h1>
  <p>Aponte a câmera traseira para o código de barras do produto.</p>

  <section class="card">
    <div id="interactive"></div>

    <div id="status" role="status">
      Toque em “Ativar câmera” para começar.
    </div>

    <button id="btnIniciar" type="button">
      Ativar câmera
    </button>

    <button id="btnVoltar" type="button"
      style="background:#475569">
      Voltar ao MR Celulares
    </button>
  </section>

  <section class="card">
    <label for="manualCode">Ou digite o código manualmente:</label>
    <input id="manualCode" inputmode="numeric"
      autocomplete="off" placeholder="Código de barras">

    <button id="btnEnviar" type="button">
      Enviar código
    </button>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>

<script>
(function () {
  const statusEl = document.getElementById('status');
  const startBtn = document.getElementById('btnIniciar');

  let scannerAtivo = false;
  let inicializando = false;
  let processando = false;
  let callbackRegistrado = false;

  function getRedirectUrl() {
    const params = new URLSearchParams(location.search);
    return params.get('redirect') || params.get('returnUrl') || '';
  }

  function pararScanner() {
    if (scannerAtivo) {
      try { Quagga.stop(); } catch (e) {}
      scannerAtivo = false;
    }

    document.querySelectorAll('#interactive video').forEach(function(video) {
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(function(track) {
          track.stop();
        });
        video.srcObject = null;
      }
    });
  }

  function voltarApp() {
    pararScanner();
    const destino = getRedirectUrl();

    if (destino) {
      location.replace(destino);
    } else {
      history.back();
    }
  }

  function enviarCodigo(codigo) {
    if (!codigo || processando) return;

    const destino = getRedirectUrl();

    if (!destino) {
      statusEl.textContent =
        'Código lido: ' + codigo +
        '\nEndereço de retorno ausente. Abra o leitor pelo aplicativo.';
      return;
    }

    let url;

    try {
      url = new URL(destino);
    } catch (e) {
      statusEl.textContent = 'O endereço de retorno é inválido.';
      return;
    }

    processando = true;
    pararScanner();

    // Compatibilidade com os parâmetros usados pelo aplicativo.
    url.searchParams.set('code', codigo);
    url.searchParams.set('codigo', codigo);
    url.searchParams.set('bar', codigo);

    statusEl.textContent =
      'Código lido: ' + codigo + '\nVoltando ao MR Celulares…';

    location.replace(url.toString());
  }

  function iniciarScanner() {
    if (inicializando || scannerAtivo) return;

    if (!window.isSecureContext ||
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
      statusEl.textContent =
        'A câmera precisa de HTTPS. Abra a ponte pelo endereço HTTPS do GitHub Pages no Chrome.';
      return;
    }

    if (typeof Quagga === 'undefined') {
      statusEl.textContent =
        'O leitor não carregou. Verifique a internet e recarregue a página.';
      return;
    }

    inicializando = true;
    startBtn.disabled = true;
    statusEl.textContent = 'Solicitando permissão para a câmera…';

    Quagga.init({
      inputStream: {
        name: 'Live',
        type: 'LiveStream',
        target: document.querySelector('#interactive'),
        constraints: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      },

      locator: {
        patchSize: 'medium',
        halfSample: true
      },

      decoder: {
        readers: [
          'ean_reader',
          'ean_8_reader',
          'upc_reader',
          'upc_e_reader',
          'code_128_reader',
          'code_39_reader',
          'i2of5_reader',
          'codabar_reader'
        ]
      },

      locate: true,
      frequency: 10

    }, function (erro) {
      inicializando = false;

      if (erro) {
        console.error(erro);
        startBtn.disabled = false;

        const nomeErro = String(
          erro.name || erro.message || erro
        );

        if (/NotAllowed|Permission|denied/i.test(nomeErro)) {
          statusEl.textContent =
            'Permissão da câmera negada. Permita a câmera nas configurações do site no Chrome e tente novamente.';
        } else if (/NotFound/i.test(nomeErro)) {
          statusEl.textContent =
            'Nenhuma câmera foi encontrada neste aparelho.';
        } else {
          statusEl.textContent =
            'Não foi possível iniciar a câmera. Confira as permissões e tente novamente.';
        }

        return;
      }

      try {
        Quagga.start();
        scannerAtivo = true;

        statusEl.textContent =
          'Câmera ativa. Mantenha o código de barras visível e bem iluminado.';

        if (!callbackRegistrado) {
          Quagga.onDetected(function (resultado) {
            if (processando ||
                !resultado ||
                !resultado.codeResult ||
                !resultado.codeResult.code) {
              return;
            }

            enviarCodigo(
              String(resultado.codeResult.code).trim()
            );
          });

          callbackRegistrado = true;
        }
      } catch (e) {
        console.error(e);
        startBtn.disabled = false;
        statusEl.textContent =
          'A câmera não iniciou corretamente. Tente novamente.';
      }
    });
  }

  startBtn.addEventListener('click', iniciarScanner);

  document.getElementById('btnVoltar')
    .addEventListener('click', voltarApp);

  document.getElementById('btnEnviar')
    .addEventListener('click', function() {
      const codigo = document.getElementById('manualCode')
        .value.trim();

      if (codigo) enviarCodigo(codigo);
    });

  document.getElementById('manualCode')
    .addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('btnEnviar').click();
      }
    });

  window.addEventListener('pagehide', pararScanner);

  if (!getRedirectUrl()) {
    statusEl.textContent =
      'Abra este leitor pelo botão do MR Celulares para retornar ao aplicativo.';
  }
})();
</script>
</body>
</html>
