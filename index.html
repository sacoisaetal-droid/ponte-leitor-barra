
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>Leitor de código de barras — MR Celulares</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      min-height: 100vh;
      background: #0b1220;
      color: #f8fafc;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      max-width: 560px;
      margin: 0 auto;
    }

    h1 {
      font-size: 22px;
      margin: 6px 0 8px;
    }

    p {
      color: #cbd5e1;
      font-size: 14px;
      line-height: 1.45;
    }

    .card {
      background: #111c2e;
      border: 1px solid #26364e;
      border-radius: 16px;
      padding: 16px;
      margin-top: 14px;
    }

    button,
    input {
      width: 100%;
      border-radius: 11px;
      padding: 14px;
      font-size: 16px;
    }

    button {
      border: 0;
      background: #0284c7;
      color: white;
      font-weight: 700;
      margin-top: 10px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    input {
      border: 1px solid #475569;
      background: #0b1220;
      color: white;
      margin-top: 8px;
    }

    #interactive {
      position: relative;
      width: 100%;
      min-height: 220px;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
      margin-top: 12px;
    }

    #interactive video,
    #interactive canvas {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
    }

    #interactive video {
      object-fit: cover;
    }

    #status {
      font-size: 14px;
      margin-top: 10px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: #38bdf8;
    }

    .orientacao {
      color: #94a3b8;
      font-size: 12px;
    }
  </style>
</head>

<body>
<main>
  <h1>Leitor de Código de Barras</h1>
  <p>Aponte a câmera traseira para o código de barras do produto.</p>

  <section class="card">
    <div id="interactive"></div>

    <p id="status">
      Toque em Iniciar leitor para ativar a câmera.
    </p>

    <button id="btnIniciar" type="button" onclick="iniciarScanner()">
      Iniciar leitor
    </button>

    <button id="btnVoltar" type="button" onclick="voltarApp()">
      Voltar para o Aplicativo
    </button>

    <p class="orientacao">
      Mantenha o código inteiro visível, com boa iluminação e sem reflexos.
    </p>
  </section>

  <section class="card">
    <label for="manualCode" style="font-size:13px;color:#94a3b8;">
      Ou digite o código manualmente:
    </label>

    <input
      id="manualCode"
      type="text"
      inputmode="numeric"
      autocomplete="off"
      placeholder="Digite o código de barras"
    >

    <button type="button" onclick="enviarManual()">
      Enviar Código
    </button>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>

<script>
  let scannerAtivo = false;
  let scannerIniciando = false;
  let enviandoCodigo = false;

  let codigoCandidato = "";
  let repeticoesCodigo = 0;

  function getRedirectUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get("redirect") || "";
  }

  function atualizarStatus(mensagem) {
    document.getElementById("status").textContent = mensagem;
  }

  function voltarApp() {
    pararScanner();

    const redirect = getRedirectUrl();

    if (redirect) {
      window.location.href = redirect;
    } else {
      window.history.back();
    }
  }

  function enviarCodigo(code) {
    const codigo = String(code || "").trim();

    if (!codigo || enviandoCodigo) return;

    enviandoCodigo = true;
    pararScanner();

    atualizarStatus("Código lido: " + codigo + "\nRetornando ao aplicativo...");

    const redirect = getRedirectUrl();

    if (redirect) {
      try {
        const destino = new URL(redirect);

        // Mantém o parâmetro de retorno utilizado pelo aplicativo.
        destino.searchParams.set("code", codigo);

        window.location.href = destino.toString();
      } catch (erro) {
        console.error(erro);
        enviandoCodigo = false;
        atualizarStatus("Não foi possível retornar ao aplicativo.");
      }
    } else {
      enviandoCodigo = false;
      document.getElementById("manualCode").value = codigo;
      atualizarStatus("Código identificado: " + codigo);
    }
  }

  function iniciarScanner() {
    if (scannerAtivo || scannerIniciando) return;

    if (typeof Quagga === "undefined") {
      atualizarStatus(
        "A biblioteca do leitor não carregou. Verifique a internet e recarregue a página."
      );
      return;
    }

    scannerIniciando = true;
    enviandoCodigo = false;
    codigoCandidato = "";
    repeticoesCodigo = 0;

    const botao = document.getElementById("btnIniciar");
    botao.disabled = true;
    botao.textContent = "Iniciando câmera...";

    atualizarStatus("Solicitando acesso à câmera...");

    Quagga.init({
      inputStream: {
        name: "Live",
        type: "LiveStream",
        target: document.querySelector("#interactive"),
        constraints: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        area: {
          top: "15%",
          right: "5%",
          left: "5%",
          bottom: "15%"
        }
      },

      locator: {
        patchSize: "medium",
        halfSample: true
      },

      decoder: {
        readers: [
          "ean_reader",
          "ean_8_reader",
          "upc_reader",
          "upc_e_reader",
          "code_128_reader",
          "code_39_reader",
          "i2of5_reader",
          "codabar_reader"
        ]
      },

      locate: true,
      frequency: 10
    }, function(err) {
      scannerIniciando = false;

      if (err) {
        console.error("Erro ao iniciar Quagga:", err);

        botao.disabled = false;
        botao.textContent = "Tentar novamente";

        atualizarStatus(
          "Não foi possível iniciar a câmera. Confira a permissão da câmera no Chrome e tente novamente."
        );
        return;
      }

      try {
        Quagga.start();
        scannerAtivo = true;

        botao.disabled = false;
        botao.textContent = "Leitor ativo";

        atualizarStatus(
          "Câmera ativa. Enquadre o código de barras e mantenha o celular firme."
        );
      } catch (erro) {
        console.error(erro);

        botao.disabled = false;
        botao.textContent = "Tentar novamente";

        atualizarStatus("Erro ao ativar o leitor. Tente novamente.");
      }
    });
  }

  // Só aceita o código após detectar o mesmo resultado várias vezes.
  QuaggaReady();

  function QuaggaReady() {
    if (typeof Quagga === "undefined") return;

    Quagga.onDetected(function(result) {
      if (!scannerAtivo || enviandoCodigo) return;
      if (!result || !result.codeResult) return;

      const codigo = String(result.codeResult.code || "").trim();

      if (!codigo) return;

      // Ignora resultados que não tenham barras decodificadas.
      const barras = result.codeResult.decodedCodes || [];
      const possuiBarrasValidas = barras.some(function(item) {
        return item && item.error === undefined;
      });

      if (!possuiBarrasValidas) return;

      if (codigo === codigoCandidato) {
        repeticoesCodigo++;
      } else {
        codigoCandidato = codigo;
        repeticoesCodigo = 1;
      }

      atualizarStatus(
        "Código detectado: " + codigo +
        "\nConfirmando leitura: " + repeticoesCodigo + "/3"
      );

      if (repeticoesCodigo >= 3) {
        enviarCodigo(codigo);
      }
    });
  }

  function pararScanner() {
    if (typeof Quagga !== "undefined" && scannerAtivo) {
      try {
        Quagga.stop();
      } catch (erro) {
        console.warn("Não foi possível parar o leitor:", erro);
      }
    }

    scannerAtivo = false;
    scannerIniciando = false;

    const botao = document.getElementById("btnIniciar");

    if (botao && !enviandoCodigo) {
      botao.disabled = false;
      botao.textContent = "Iniciar leitor";
    }
  }

  function enviarManual() {
    const valor = document.getElementById("manualCode").value.trim();

    if (!valor) {
      atualizarStatus("Digite um código antes de enviar.");
      return;
    }

    enviarCodigo(valor);
  }

  document.getElementById("manualCode").addEventListener(
    "keydown",
    function(evento) {
      if (evento.key === "Enter") {
        enviarManual();
      }
    }
  );

  window.addEventListener("pagehide", function() {
    pararScanner();
  });
</script>
</body>
</html>
