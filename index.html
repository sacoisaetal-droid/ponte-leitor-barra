<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>Leitor de código de barras — MR Celulares</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 18px; min-height: 100vh; background: #0b1220; color: #f8fafc; font-family: Arial, sans-serif; text-align: center; }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 6px 0 8px; }
    p { color: #cbd5e1; font-size: 14px; line-height: 1.45; }
    .card { background: #111c2e; border: 1px solid #26364e; border-radius: 16px; padding: 16px; margin-top: 14px; }
    button, input { width: 100%; border-radius: 11px; padding: 14px; font-size: 16px; }
    button { border: 0; background: #0284c7; color: white; font-weight: 700; margin-top: 10px; cursor: pointer; }
    input { border: 1px solid #475569; background: #0b1220; color: white; margin-top: 8px; }
    #interactive.viewport { position: relative; width: 100%; height: auto; overflow: hidden; border-radius: 12px; background: #000; margin-top: 12px; }
    #interactive.viewport video, canvas { width: 100%; height: 100%; object-fit: cover; }
    #status { font-size: 14px; margin-top: 10px; white-space: pre-wrap; color: #38bdf8; }
  </style>
</head>
<body>
<main>
  <h1>Leitor de Código de Barras</h1>
  <p>Aponte a câmera para o código do produto</p>
  
  <section class="card">
    <div id="interactive" class="viewport">
      <video id="video" autoplay playsinline muted></video>
    </div>
    <p id="status">Iniciando a câmera...</p>
    <button id="btnVoltar" type="button" onclick="voltarApp()">Voltar para o Aplicativo</button>
  </section>

  <section class="card">
    <label style="font-size: 13px; color: #94a3b8;">Ou digite o código manualmente:</label>
    <input id="manualCode" inputmode="numeric" placeholder="Digite o código">
    <button type="button" onclick="enviarManual()">Enviar Código</button>
  </section>
</main>

<!-- Usando a biblioteca QuaggaJS que tem alta compatibilidade móvel -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
<script>
  let scannerAtivo = false;

  function getRedirectUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get('redirect') || '';
  }

  function voltarApp() {
    const redirect = getRedirectUrl();
    if (redirect) {
      window.location.href = redirect;
    } else {
      window.history.back();
    }
  }

  function enviarCodigo(code) {
    if (!code) return;
    pararScanner();
    const redirect = getRedirectUrl();
    if (redirect) {
      const target = new URL(redirect);
      target.searchParams.set('code', code);
      window.location.href = target.toString();
    } else {
      document.getElementById('status').textContent = 'Código lido: ' + code;
    }
  }

  function iniciarScanner() {
    const constraints = {
      width: { ideal: 1280 },
      height: { ideal: 720 },
      facingMode: "environment" // Tenta usar a câmera traseira no celular
    };

    Quagga.init({
      inputStream : {
        name : "Live",
        type : "LiveStream",
        target: document.querySelector('#interactive'),
        constraints: constraints
      },
      decoder : {
        readers : ["code_128_reader", "ean_reader", "ean_8_reader", "upc_reader", "code_39_reader"]
      },
      locate: true
    }, function(err) {
      if (err) {
        document.getElementById('status').textContent = "Erro ao abrir câmera. Verifique as permissões do navegador.";
        console.error(err);
        return;
      }
      Quagga.start();
      scannerAtivo = true;
      document.getElementById('status').textContent = "Câmera ativa. Posicione o código de barras.";
    });

    Quagga.onDetected(function(result) {
      if (result && result.codeResult && result.codeResult.code) {
        const codigo = result.codeResult.code;
        enviarCodigo(codigo);
      }
    });
  }

  function pararScanner() {
    if (scannerAtivo) {
      try { Quagga.stop(); } catch(e){}
      scannerAtivo = false;
    }
  }

  function enviarManual() {
    const val = document.getElementById('manualCode').value.trim();
    if (val) enviarCodigo(val);
  }

  document.getElementById('manualCode').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') enviarManual();
  });

  window.addEventListener('load', function() {
    iniciarScanner();
  });

  window.addEventListener('pagehide', function() {
    pararScanner();
  });
</script>
</body>
</html>
