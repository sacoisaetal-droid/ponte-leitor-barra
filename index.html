<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>Leitor de código de barras — MR Celulares</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 18px; min-height: 100vh;
      background: #0b1220; color: #f8fafc;
      font-family: Arial, sans-serif; text-align: center;
    }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 6px 0 8px; }
    p { color: #cbd5e1; font-size: 14px; line-height: 1.45; }
    .card {
      background: #111c2e; border: 1px solid #26364e;
      border-radius: 16px; padding: 16px; margin-top: 14px;
    }
    button, input {
      width: 100%; border-radius: 11px; padding: 14px; font-size: 16px;
    }
    button {
      border: 0; background: #0284c7; color: white;
      font-weight: 700; margin-top: 10px; cursor: pointer;
    }
    input {
      border: 1px solid #475569; background: #0b1220; color: white; margin-top: 8px;
    }
    video {
      display: block; width: 100%; max-height: 50vh;
      object-fit: cover; background: #000; border-radius: 12px; margin-top: 12px;
    }
    #status {
      font-size: 14px; margin-top: 12px; white-space: pre-wrap; color: #38bdf8;
    }
  </style>
</head>
<body>
<main>
  <h1>Leitor de Código de Barras</h1>
  <p>Aponte a câmera para o código do produto.</p>

  <section class="card">
    <video id="video" autoplay muted playsinline></video>
    
    <p id="status">Toque em "Iniciar Leitor" abaixo.</p>

    <button id="btnIniciar" type="button" onclick="iniciarLeitor()">Iniciar Leitor</button>
    <button type="button" style="background: #334155; margin-top: 10px;" onclick="voltarApp()">Voltar para o Aplicativo</button>
  </section>

  <section class="card">
    <label for="manualCode" style="font-size:13px;color:#94a3b8;">Ou digite o código manualmente:</label>
    <input id="manualCode" type="text" inputmode="numeric" autocomplete="off" placeholder="Digite o código de barras">
    <button type="button" onclick="enviarManual()">Enviar Código</button>
  </section>
</main>

<!-- Biblioteca oficial ZXing Browser UMD -->
<script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
<script>
  let codeReader = null;
  let controlsRef = null;
  let lidoComSucesso = false;

  function getRedirectUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get("redirect") || "";
  }

  function atualizarStatus(msg) {
    document.getElementById("status").textContent = msg;
  }

  function voltarApp() {
    pararLeitor();
    const redirect = getRedirectUrl();
    if (redirect) {
      window.location.href = redirect;
    } else {
      window.history.back();
    }
  }

  function enviarCodigo(codigo) {
    if (!codigo || lidoComSucesso) return;
    lidoComSucesso = true;
    pararLeitor();

    atualizarStatus("Código lido: " + codigo + "\nRetornando ao app...");
    const redirect = getRedirectUrl();

    if (redirect) {
      try {
        const destino = new URL(redirect);
        destino.searchParams.set("code", codigo);
        window.location.href = destino.toString();
      } catch (e) {
        atualizarStatus("Erro ao retornar.");
      }
    } else {
      document.getElementById("manualCode").value = codigo;
    }
  }

  async function iniciarLeitor() {
    lidoComSucesso = false;
    atualizarStatus("Iniciando a câmera traseira...");
    
    try {
      if (!codeReader) {
        codeReader = new ZXingBrowser.BrowserMultiFormatReader();
      }

      // Abre o fluxo de vídeo direcionando especificamente para a câmera traseira do celular
      controlsRef = await codeReader.decodeFromConstraints(
        { video: { facingMode: { exact: "environment" } } }, 
        'video', 
        (result, err) => {
          if (result) {
            enviarCodigo(result.text);
          }
        }
      );
      atualizarStatus("Câmera ativa! Posicione o código de barras na tela.");
      document.getElementById("btnIniciar").textContent = "Parar Câmera";
      document.getElementById("btnIniciar").setAttribute("onclick", "pararLeitorManual()");

    } catch (e) {
      // Fallback caso o celular não aceite o "exact", tenta abrir qualquer câmera disponível
      try {
        controlsRef = await codeReader.decodeFromConstraints(
          { video: { facingMode: "environment" } }, 
          'video', 
          (result, err) => {
            if (result) {
              enviarCodigo(result.text);
            }
          }
        );
        atualizarStatus("Câmera ativa!");
        document.getElementById("btnIniciar").textContent = "Parar Câmera";
        document.getElementById("btnIniciar").setAttribute("onclick", "pararLeitorManual()");
      } catch (err2) {
        atualizarStatus("Não foi possível acessar a câmera. Verifique se o navegador tem permissão.");
        console.error(err2);
      }
    }
  }

  function pararLeitorManual() {
    pararLeitor();
    atualizarStatus("Leitor parado.");
    document.getElementById("btnIniciar").textContent = "Iniciar Leitor";
    document.getElementById("btnIniciar").setAttribute("onclick", "iniciarLeitor()");
  }

  function pararLeitor() {
    if (controlsRef) {
      try { controlsRef.stop(); } catch(err){}
      controlsRef = null;
    }
  }

  function enviarManual() {
    const valor = document.getElementById("manualCode").value.trim();
    if (!valor) {
      atualizarStatus("Digite um código antes de enviar.");
      return;
    }
    enviarCodigo(valor);
  }

  document.getElementById("manualCode").addEventListener("keydown", function(e) {
    if (e.key === "Enter") enviarManual();
  });

  window.addEventListener("pagehide", pararLeitor);
</script>
</body>
</html>
