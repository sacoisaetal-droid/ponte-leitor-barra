<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Leitor de Código de Barras - MR Celulares</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Biblioteca profissional de leitura em tempo real (ZXing / Html5-Qrcode) -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { background-color: #0b0f19; color: #fff; font-family: system-ui, sans-serif; }
    #reader video { object-fit: cover !important; border-radius: 0.75rem; }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-2xl space-y-4 text-center">
    <div class="space-y-1">
      <h2 class="font-bold text-lg text-sky-400">Leitor Automático</h2>
      <p class="text-xs text-slate-400">Aponte para o código de barras. A deteção é automática.</p>
    </div>
    
    <!-- Visor da câmera em tempo real -->
    <div id="reader" class="w-full h-72 overflow-hidden rounded-xl border border-slate-700 bg-black flex items-center justify-center">
      <p class="text-xs text-slate-500 animate-pulse">A ligar a câmara...</p>
    </div>

    <div id="statusLeitura" class="text-xs text-emerald-400 font-semibold h-5"></div>

    <button onclick="cancelarLeitura()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-3 rounded-xl text-sm border border-slate-700 transition">
      Voltar sem Ler
    </button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const redirectUrl = urlParams.get('redirect');
    let html5QrCode = null;
    let jaLeu = false;

    function retornarAoApp(codigo) {
      if (jaLeu) return;
      jaLeu = true;
      
      document.getElementById('statusLeitura').textContent = 'Código detetado: ' + codigo + '. A retornar...';

      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(function() {
          finalizarRedirecionamento(codigo);
        }).catch(function() {
          finalizarRedirecionamento(codigo);
        });
      } else {
        finalizarRedirecionamento(codigo);
      }
    }

    function finalizarRedirecionamento(codigo) {
      if (redirectUrl) {
        if (codigo) {
          window.location.href = redirectUrl + (redirectUrl.includes('?') ? '&' : '?') + 'code=' + encodeURIComponent(codigo);
        } else {
          window.location.href = redirectUrl;
        }
      }
    }

    function cancelarLeitura() {
      retornarAoApp('');
    }

    window.addEventListener('DOMContentLoaded', function () {
      html5QrCode = new Html5Qrcode("reader");
      
      // Configuração para varrimento contínuo de alta precisão
      const config = { 
        fps: 20, 
        qrbox: { width: 260, height: 120 },
        aspectRatio: 1.0
      };

      // Tenta iniciar com a câmara traseira (environment)
      html5QrCode.start(
        { facingMode: "environment" }, 
        config, 
        function (decodedText) {
          // Sucesso automático! Assim que a câmara reconhece o código de barras
          retornarAoApp(decodedText);
        }, 
        function (errorMessage) {
          // Ignora os erros de frames onde o código ainda não está no foco
        }
      ).catch(function (err) {
        // Se falhar a câmara traseira direta, tenta iniciar com qualquer câmara disponível
        html5QrCode.start(
          { facingMode: "user" }, 
          config, 
          function (decodedText) { retornarAoApp(decodedText); }, 
          function (err2) {}
        ).catch(function (e) {
          alert("Não foi possível aceder à câmara. Verifique se permitiu o uso da câmara nas definições do navegador.");
        });
      });
    });
  </script>
</body>
</html>
